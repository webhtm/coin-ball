<html><head><base href="https://websim.ai">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05070d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Coin Ball</title>
  <style>
    :root {
      --accent: #7cffb2;
      --accent2: #6ea8ff;
      --panel-bg: rgba(20, 26, 46, 0.55);
      --panel-border: rgba(255,255,255,0.14);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:#000;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
    }
    canvas { width: 100%; height: 100%; display:block; touch-action: none; }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      font-family: 'Poppins', Arial, sans-serif;
    }
    svg { display: block; }
    .icon { flex-shrink: 0; }

    #hud {
      display: none;
    }
    #winMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: 'Arial Black', sans-serif;
      font-size: 64px;
      text-align: center;
      text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00;
      opacity: 0;
      transition: opacity 1s;
      display: none;
      z-index: 50;
    }
    #winMessage button, #levelCompleteMsg button {
      pointer-events: auto;
    }
    #fireworks {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
    /* ---------- HUD chips (glass pills) ---------- */
    .chip {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(15, 18, 32, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.16);
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .chip-btn {
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.12s, background 0.15s;
    }
    .chip-btn:hover { background: rgba(35, 42, 68, 0.7); }
    .chip-btn:active { transform: scale(0.94); }

    #topRight {
      position: absolute;
      top: calc(10px + var(--safe-t));
      right: calc(10px + var(--safe-r));
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 20;
    }
    #coinCount { color: #ffd76a; }
    #levelInfo {
      position: absolute;
      bottom: calc(10px + var(--safe-b));
      left: calc(10px + var(--safe-l));
      z-index: 20;
    }
    #credits {
      position: absolute;
      bottom: calc(10px + var(--safe-b));
      right: calc(10px + var(--safe-r));
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      padding: 6px 10px;
      z-index: 15;
    }
    #timer {
      position: absolute;
      top: calc(10px + var(--safe-t));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }
    @media (max-width: 700px) {
      .chip { font-size: 13px; padding: 6px 10px; gap: 8px; }
      .chip .icon { width: 15px; height: 15px; }
      #credits { display: none; }
    }
    @keyframes rainbow {
      0% { color: red; }
      14% { color: orange; }
      28% { color: yellow; }
      42% { color: green; }
      56% { color: blue; }
      70% { color: indigo; }
      84% { color: violet; }
      100% { color: red; }
    }
    #winMessage span.letter {
      display: inline-block;
      animation: rainbow 5s linear infinite, bounce 0.5s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }

    /* ---------- Overlays ---------- */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(circle at 50% 15%, rgba(124,255,178,0.10) 0%, transparent 45%),
        radial-gradient(circle at 50% 20%, #1b2a4a 0%, #05070d 80%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      overflow-y: auto;
      padding: calc(20px + var(--safe-t)) calc(20px + var(--safe-r)) calc(20px + var(--safe-b)) calc(20px + var(--safe-l));
    }
    .hidden { display: none !important; }
    .title {
      font-size: clamp(34px, 8vw, 52px);
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #ff5e5e, #ffb347, #ffe066, #7cffb2, #6ea8ff, #b380ff, #ff7ce0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
    }
    .subtitle { opacity: 0.7; margin-bottom: 24px; font-size: 14px; text-align:center; }
    h3 { font-weight: 600; opacity: 0.9; letter-spacing: 0.3px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)), #202a45;
      border: 1px solid rgba(255,255,255,0.18);
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 13px 24px;
      margin: 6px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      min-width: 190px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.28);
    }
    .btn .icon { width: 20px; height: 20px; opacity: 0.95; }
    .btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.32); box-shadow: 0 8px 22px rgba(0,0,0,0.35); }
    .btn:active { transform: translateY(0) scale(0.96); }
    .btn.small { font-size: 14px; padding: 10px 18px; min-width: 120px; }
    .btn.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,255,178,0.25), 0 6px 18px rgba(124,255,178,0.15); color: var(--accent); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 24px;
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    #levelGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 94px);
      gap: 10px;
      justify-content: center;
      max-height: 50vh;
      overflow-y: auto;
      padding: 10px;
      width: 100%;
    }
    .levelTile {
      background: linear-gradient(180deg,#243252,#141b30);
      border: 1px solid #3c4f80;
      border-radius: 14px;
      color: white;
      padding: 12px 6px;
      cursor: pointer;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.12s ease, box-shadow 0.15s ease;
    }
    .levelTile:hover { background: linear-gradient(180deg,#33477a,#1c2748); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.3); }
    .levelTile:active { transform: translateY(0) scale(0.96); }
    .levelTile .diff {
      font-size: 9px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase;
      display: inline-block; margin-top: 5px; padding: 2px 8px; border-radius: 999px;
      background: rgba(255,255,255,0.08); opacity: 0.85;
    }
    .levelTile .best { font-size: 10px; color: var(--accent); display:flex; align-items:center; justify-content:center; gap:3px; margin-top:4px; }
    .levelTile .best .icon { width: 11px; height: 11px; }
    .easy .diff { color: #7be08a; }
    .medium .diff { color: #ffd76a; }
    .hard .diff { color: #ff9d70; }
    .extreme .diff { color: #ff6b6b; }
    .easy { border-color: #3c6b46; }
    .medium { border-color: #7a6a2e; }
    .hard { border-color: #7a4530; }
    .extreme { border-color: #7a3232; }
    #endlessTile {
      background: linear-gradient(180deg,#5a2d7a,#2b1442);
      border-color: #b06be0;
      grid-column: span 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    #endlessTile .icon { width: 22px; height: 22px; }

    /* ---------- Mobile Controls ---------- */
    #joystickBase {
      position: absolute;
      bottom: calc(36px + var(--safe-b));
      left: calc(36px + var(--safe-l));
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
      border: 2px solid rgba(255,255,255,0.28);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 0 20px rgba(0,0,0,0.2);
      touch-action: none;
      z-index: 60;
    }
    #joystickKnob {
      position: absolute;
      top: 50%; left: 50%;
      width: 58px; height: 58px;
      margin-left: -29px; margin-top: -29px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #cfd8ff);
      border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      pointer-events: none;
      transition: background 0.15s;
    }
    #mobilePauseBtn {
      position: absolute;
      bottom: calc(36px + var(--safe-b));
      right: calc(36px + var(--safe-r));
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: rgba(20, 24, 40, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    #mobilePauseBtn:active { transform: scale(0.92); }
    #mobilePauseBtn .icon { width: 26px; height: 26px; }
  </style>
  </head>
  <body>

  <!-- ================= MAIN MENU ================= -->
  <div id="mainMenu" class="overlay">
    <div class="title">COIN BALL</div>

    <div class="panel">
      <h3 style="margin:4px 0 10px;">Choose your controls</h3>
      <div class="row">
        <div id="pcBtn" class="btn selected"><span class="icon" data-icon="pc"></span>PC</div>
        <div id="mobileBtn" class="btn"><span class="icon" data-icon="touch"></span>Touch</div>
      </div>
      <div class="row" style="margin-top:20px;">
        <div id="playBtn" class="btn"><span class="icon" data-icon="play"></span>Play level 1</div>
        <div id="levelSelectBtn" class="btn"><span class="icon" data-icon="grid"></span>Level Select</div>
        <div id="endlessBtn" class="btn"><span class="icon" data-icon="infinity"></span>Endless Mode</div>
      </div>
    </div>
  </div>

  <!-- ================= LEVEL SELECT ================= -->
  <div id="levelSelectMenu" class="overlay hidden">
    <div class="title" style="font-size:32px;">SELECT LEVEL</div>
    <div class="panel">
      <div id="levelGrid"></div>
      <div class="row" style="margin-top:16px;">
        <div id="backToMenuBtn" class="btn small"><span class="icon" data-icon="back"></span>Back</div>
      </div>
    </div>
  </div>

  <!-- ================= PAUSE MENU ================= -->
  <div id="pauseMenu" class="overlay hidden">
    <div class="title" style="font-size:32px;">PAUSED</div>
    <div class="panel">
      <div class="row">
        <div id="resumeBtn" class="btn"><span class="icon" data-icon="play"></span>Resume</div>
        <div id="restartBtn" class="btn"><span class="icon" data-icon="restart"></span>Restart Level</div>
        <div id="regenBtnMenu" class="btn"><span class="icon" data-icon="dice"></span>Regenerate Layout</div>
        <div id="pauseLevelSelectBtn" class="btn"><span class="icon" data-icon="grid"></span>Level Select</div>
        <div id="mainMenuBtn" class="btn"><span class="icon" data-icon="home"></span>Main Menu</div>
      </div>
    </div>
  </div>

  <!-- ================= IN-GAME HUD ================= -->

  <div id="winMessage">
    <span class="letter">Y</span><span class="letter">o</span><span class="letter">u</span> <span class="letter">W</span><span class="letter">i</span><span class="letter">n</span><span class="letter">!</span>
    <div class="row" style="justify-content:center; margin-top:20px;">
      <div id="winMainMenuBtn" class="btn"><span class="icon" data-icon="home"></span>Main Menu</div>
    </div>
  </div>
  <div id="fireworks"></div>
  <div id="topRight">
    <div id="coinCount" class="chip"><span class="icon" data-icon="coin"></span><span id="coinCountText">Coins: 0</span></div>
    <div id="pauseBtn" class="chip chip-btn"><span class="icon" data-icon="pause"></span><span>Pause</span></div>
    <div id="regenBtn" class="chip chip-btn"><span class="icon" data-icon="dice"></span><span>New Layout</span></div>
  </div>
  <div id="levelInfo" class="chip"><span class="icon" data-icon="flag"></span><span id="levelInfoText">Level: 1</span></div>
  <div id="timer" class="chip"><span class="icon" data-icon="timer"></span><span id="timerText">00:00.000</span></div>

  <!-- Mobile controls -->
  <div id="joystickBase" class="hidden">
    <div id="joystickKnob"></div>
  </div>
  <div id="mobilePauseBtn" class="hidden"><span class="icon" data-icon="pause"></span></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  <script>
    const ICONS = {
      pc: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></svg>',
      touch: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>',
      play: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5.2c0-.9 1-1.4 1.7-.9l10 6.8c.6.4.6 1.3 0 1.8l-10 6.8c-.7.5-1.7 0-1.7-.9z" fill="currentColor"/></svg>',
      grid: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>',
      infinity: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.2 8c4.4 0 4.4 8 0 8-3.2 0-5-4-6.2-4-1.2 0-3 4-6.2 4-4.4 0-4.4-8 0-8 3.2 0 5 4 6.2 4 1.2 0 3-4 6.2-4z"/></svg>',
      back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>',
      restart: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>',
      dice: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="8" cy="8" r="1.15" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.15" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.15" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/></svg>',
      home: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5l9-8 9 8"/><path d="M5.5 10v10.5h13V10"/><path d="M10 20.5v-6h4v6"/></svg>',
      pause: '<svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="4.5" width="4.2" height="15" rx="1.6" fill="currentColor"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.6" fill="currentColor"/></svg>',
      coin: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v9M9.3 9.7c0-1.3 1.1-2.2 2.7-2.2s2.7.9 2.7 2c0 2.6-5.4 1.5-5.4 4.1 0 1.1 1.1 2 2.7 2s2.7-.9 2.7-2"/></svg>',
      flag: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 21V4"/><path d="M5.5 4.5h12.5l-3 3.75 3 3.75H5.5"/></svg>',
      timer: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.8 1.8"/><path d="M9.5 2.5h5"/></svg>',
      trophy: '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3 4"/><path d="M17 5h3a3 3 0 0 1-3 4"/><path d="M12 13v3"/><path d="M9 20h6"/><path d="M10 17h4l.6 3H9.4z"/></svg>'
    };
    function applyIcons(root) {
      (root || document).querySelectorAll('[data-icon]').forEach(el => {
        const name = el.getAttribute('data-icon');
        if (ICONS[name]) el.innerHTML = ICONS[name];
        el.classList.add('icon');
      });
    }
    applyIcons(document);
  </script>
  <script>
    let scene, camera, renderer, ball, platform;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let acceleration = new THREE.Vector3();
    let walls = [];
    let coins = [];
    let holes = [];
    let coinsRemaining = 0;
    let clouds = [];
    let currentLevel = 1;
    let totalLevels = 30;
    let gameWon = false;
    let startTime;
    let timerInterval;
    let paused = false;
    let pausedAt = 0;
    let controlScheme = 'pc';
    let endlessMode = false;
    let currentLevelConfig = null;
    let currentSeed = null;
    let gameStarted = false;

    // Joystick state
    const joystickVector = { x: 0, z: 0 };

    // Sound effects
    const sounds = {
      coinCollect: new Howl({ src: ['https://freesound.org/data/previews/162/162805_2578041-lq.mp3'], volume: 0.5 }),
      levelComplete: new Howl({ src: ['https://freesound.org/data/previews/122/122255_1074082-lq.mp3'], volume: 0.5 }),
      fallInHole: new Howl({ src: ['https://freesound.org/data/previews/326/326133_3271346-lq.mp3'], volume: 0.5 }),
      backgroundMusic: new Howl({ src: ['https://freesound.org/data/previews/560/560738_12295155-lq.mp3'], volume: 0.3, loop: true }),
      winSound: new Howl({ src: ['https://freesound.org/data/previews/258/258142_4631294-lq.mp3'], volume: 0.5 })
    };

    /* ============================================================
       PROCEDURAL LEVEL GENERATION
       ============================================================ */

    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function shuffleArr(arr, rand) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function difficultyLabel(levelNumber) {
      if (levelNumber <= 5) return { text: 'Easy', cls: 'easy' };
      if (levelNumber <= 15) return { text: 'Medium', cls: 'medium' };
      if (levelNumber <= 25) return { text: 'Hard', cls: 'hard' };
      return { text: 'Extreme', cls: 'extreme' };
    }

    // Generation rules:
    //  - Grid size grows every 3 levels (3 -> 6), producing a bigger maze.
    //  - A perfect maze is carved with a recursive backtracker (seeded).
    //  - "Openness" extra-removes some walls; higher levels are less open (harder).
    //  - Coin count and hole count scale up with level number.
    function generateLevel(levelNumber, customSeed) {
      const seed = (customSeed !== undefined && customSeed !== null) ? customSeed : (levelNumber * 100003 + 7);
      const rand = mulberry32(seed);

      const gridSize = Math.min(3 + Math.floor((levelNumber - 1) / 3), 6);
      const cell = 20 / gridSize;
      const half = cell / 2;
      const xzMin = -10;

      const xCenter = c => xzMin + cell * (c + 0.5);
      const zCenter = r => xzMin + cell * (r + 0.5);

      // cell walls: true = wall present
      const cells = [];
      for (let r = 0; r < gridSize; r++) {
        cells.push([]);
        for (let c = 0; c < gridSize; c++) {
          cells[r].push({ N: true, S: true, E: true, W: true, visited: false });
        }
      }

      // iterative recursive-backtracker maze carve (avoids call stack issues)
      function carveMaze(startR, startC) {
        const stack = [[startR, startC]];
        cells[startR][startC].visited = true;
        while (stack.length) {
          const [r, c] = stack[stack.length - 1];
          const dirs = shuffleArr([
            [-1, 0, 'N', 'S'], [1, 0, 'S', 'N'], [0, -1, 'W', 'E'], [0, 1, 'E', 'W']
          ], rand);
          let moved = false;
          for (const [dr, dc, side, opp] of dirs) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && !cells[nr][nc].visited) {
              cells[r][c][side] = false;
              cells[nr][nc][opp] = false;
              cells[nr][nc].visited = true;
              stack.push([nr, nc]);
              moved = true;
              break;
            }
          }
          if (!moved) stack.pop();
        }
      }
      carveMaze(0, 0);

      // Extra openness pass - lower levels get more shortcuts removed (easier), higher levels stay tight.
      const opennessFactor = Math.max(0.04, 0.45 - levelNumber * 0.012);
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (r > 0 && cells[r][c].N && rand() < opennessFactor) {
            cells[r][c].N = false;
            cells[r - 1][c].S = false;
          }
          if (c > 0 && cells[r][c].W && rand() < opennessFactor) {
            cells[r][c].W = false;
            cells[r][c - 1].E = false;
          }
        }
      }

      // Build wall segment list: { x, z, w, d } (w = width along x, d = depth along z)
      const wallSegs = [];
      const wallThickness = 0.15;
      const wallHeight = 1;
      // outer boundary
      wallSegs.push({ x: 0, y: 0.5, z: -10, w: 20, h: wallHeight, d: wallThickness });
      wallSegs.push({ x: 0, y: 0.5, z: 10, w: 20, h: wallHeight, d: wallThickness });
      wallSegs.push({ x: -10, y: 0.5, z: 0, w: wallThickness, h: wallHeight, d: 20 });
      wallSegs.push({ x: 10, y: 0.5, z: 0, w: wallThickness, h: wallHeight, d: 20 });
      // interior horizontal walls (N side of each cell in rows > 0)
      for (let r = 1; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (cells[r][c].N) {
            wallSegs.push({ x: xCenter(c), y: 0.5, z: xzMin + cell * r, w: cell, h: wallHeight, d: wallThickness });
          }
        }
      }
      // interior vertical walls (W side of each cell in cols > 0)
      for (let c = 1; c < gridSize; c++) {
        for (let r = 0; r < gridSize; r++) {
          if (cells[r][c].W) {
            wallSegs.push({ x: xzMin + cell * c, y: 0.5, z: zCenter(r), w: wallThickness, h: wallHeight, d: cell });
          }
        }
      }

      const startCell = { r: 0, c: 0 };
      const endCell = { r: gridSize - 1, c: gridSize - 1 };
      const startPos = new THREE.Vector3(xzMin + cell * 0.1, 0.5, xzMin + cell * 0.1);
      const winPos = new THREE.Vector3(xCenter(endCell.c), 0, zCenter(endCell.r));

      // pick cells for coins/holes, skipping start & end cells
      const availableCells = [];
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if ((r === startCell.r && c === startCell.c) || (r === endCell.r && c === endCell.c)) continue;
          availableCells.push({ r, c });
        }
      }
      const shuffledCells = shuffleArr(availableCells, rand);

      const coinCount = Math.min(4 + Math.floor(levelNumber * 0.8), Math.max(3, shuffledCells.length - 2));
      const holeCount = Math.min(Math.floor(levelNumber * 0.6), Math.max(0, shuffledCells.length - coinCount - 1));

      const coinPositions = [];
      const holePositions = [];
      let idx = 0;
      for (let i = 0; i < coinCount && idx < shuffledCells.length; i++, idx++) {
        const cellRef = shuffledCells[idx];
        const jitter = cell * 0.18;
        coinPositions.push({
          x: xCenter(cellRef.c) + (rand() - 0.5) * jitter,
          z: zCenter(cellRef.r) + (rand() - 0.5) * jitter
        });
      }
      for (let i = 0; i < holeCount && idx < shuffledCells.length; i++, idx++) {
        const cellRef = shuffledCells[idx];
        holePositions.push({ x: xCenter(cellRef.c), z: zCenter(cellRef.r) });
      }

      return {
        gridSize, cell, wallSegs, coinPositions, holePositions,
        startPos, winPos, seed
      };
    }

    /* ============================================================
       SCENE / LEVEL LOADING
       ============================================================ */

    function initRenderer() {
      if (renderer) return;
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      window.addEventListener('resize', function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);

      animate();
    }

    function addLights() {
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 7);
      directionalLight.castShadow = true;
      directionalLight.shadow.mapSize.width = 2048;
      directionalLight.shadow.mapSize.height = 2048;
      directionalLight.shadow.camera.near = 1;
      directionalLight.shadow.camera.far = 50;
      directionalLight.shadow.camera.left = -25;
      directionalLight.shadow.camera.right = 25;
      directionalLight.shadow.camera.top = 25;
      directionalLight.shadow.camera.bottom = -25;
      scene.add(directionalLight);
    }

    function clearLevel() {
      while (scene.children.length > 0) {
        scene.remove(scene.children[0]);
      }
      addLights();
      walls = [];
      coins = [];
      holes = [];
      clouds = [];
      coinsRemaining = 0;
    }

    function loadLevel(level, seedOverride) {
      clearLevel();

      const isFinalNormalLevel = (!endlessMode && level >= totalLevels);
      scene.background = new THREE.Color(isFinalNormalLevel ? 0xff5533 : 0x87CEEB);

      currentLevelConfig = generateLevel(level, seedOverride);
      currentSeed = currentLevelConfig.seed;

      createBall(currentLevelConfig.startPos);
      createPlatform();
      createWallsFromConfig(currentLevelConfig);
      createCoinsFromConfig(currentLevelConfig);
      createHolesFromConfig(currentLevelConfig);
      createClouds();
      createWinPlatform(currentLevelConfig.winPos);

      document.getElementById('levelInfoText').textContent = endlessMode
        ? `Endless — Level: ${level}`
        : `Level: ${level} / ${totalLevels}`;
      updateCoinCounter();
    }

    function createBall(pos) {
      const geometry = new THREE.SphereGeometry(0.5, 32, 32);
      const rainbowTexture = createRainbowTexture();
      const material = new THREE.MeshPhongMaterial({ map: rainbowTexture });
      ball = new THREE.Mesh(geometry, material);
      ball.position.copy(pos);
      ball.castShadow = true;
      scene.add(ball);
      velocity.set(0, 0, 0);
    }

    function createPlatform() {
      const platformGeometry = new THREE.BoxGeometry(20, 0.1, 20);
      const grassTexture = createGrassTexture();
      const platformMaterial = new THREE.MeshPhongMaterial({ map: grassTexture });
      platform = new THREE.Mesh(platformGeometry, platformMaterial);
      platform.position.set(0, -0.05, 0);
      platform.receiveShadow = true;
      scene.add(platform);
    }

    function createWallsFromConfig(config) {
      const brickTexture = createBrickTexture();
      for (const seg of config.wallSegs) {
        createWall(seg.x, seg.y, seg.z, seg.w, seg.h, seg.d, brickTexture.clone());
      }
    }

    function createCoinsFromConfig(config) {
      const coinTexture = createCoinTexture();
      for (const p of config.coinPositions) {
        createCoin(p.x, 0.5, p.z, coinTexture);
      }
      coinsRemaining = coins.length;
      updateCoinCounter();
    }

    function createHolesFromConfig(config) {
      const holeGeometry = new THREE.CircleGeometry(0.5, 32);
      const holeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
      for (const p of config.holePositions) {
        createHole(p.x, 0.01, p.z, holeGeometry, holeMaterial);
      }
    }

    function createHole(x, y, z, geometry, material) {
      const hole = new THREE.Mesh(geometry, material);
      hole.position.set(x, y, z);
      hole.rotation.x = -Math.PI / 2;
      scene.add(hole);
      holes.push(hole);
    }

    function createWinPlatform(winPos) {
      const winPlatformGeometry = new THREE.BoxGeometry(2, 0.1, 2);
      const winPlatformMaterial = new THREE.MeshPhongMaterial({ map: createCheckerboardTexture() });
      const winPlatform = new THREE.Mesh(winPlatformGeometry, winPlatformMaterial);
      winPlatform.position.copy(winPos);
      winPlatform.receiveShadow = true;
      scene.add(winPlatform);
    }

    /* ---------------- Textures ---------------- */

    function createRainbowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const context = canvas.getContext('2d');
      const gradient = context.createLinearGradient(0, 0, 0, 256);
      gradient.addColorStop(0, 'red');
      gradient.addColorStop(1/6, 'orange');
      gradient.addColorStop(2/6, 'yellow');
      gradient.addColorStop(3/6, 'green');
      gradient.addColorStop(4/6, 'blue');
      gradient.addColorStop(5/6, 'indigo');
      gradient.addColorStop(1, 'violet');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(canvas);
    }

    function createBrickTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const context = canvas.getContext('2d');
      context.fillStyle = '#CCCCCC';
      context.fillRect(0, 0, 256, 256);
      context.fillStyle = '#993333';
      const brickHeight = 32, brickWidth = 64;
      let offsetX = 0;
      for (let y = 0; y < 256; y += brickHeight) {
        for (let x = offsetX; x < 256; x += brickWidth) {
          context.fillRect(x + 1, y + 1, brickWidth - 2, brickHeight - 2);
        }
        offsetX = (offsetX === 0) ? -brickWidth / 2 : 0;
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1, 1);
      return texture;
    }

    function createGrassTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const context = canvas.getContext('2d');
      context.fillStyle = '#4CAF50';
      context.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 1000; i++) {
        const x = Math.random() * 256, y = Math.random() * 256, size = Math.random() * 4 + 1;
        context.fillStyle = Math.random() > 0.5 ? '#45a049' : '#5cb860';
        context.fillRect(x, y, size, size);
      }
      for (let i = 0; i < 500; i++) {
        const x = Math.random() * 256, y = Math.random() * 256;
        context.strokeStyle = '#66bb6a';
        context.beginPath();
        context.moveTo(x, y);
        context.lineTo(x + Math.random() * 4 - 2, y - Math.random() * 5 - 5);
        context.stroke();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(10, 10);
      return texture;
    }

    function createCoinTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const context = canvas.getContext('2d');
      context.fillStyle = '#FFD700';
      context.fillRect(0, 0, 128, 128);
      const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(255, 223, 0, 1)');
      gradient.addColorStop(1, 'rgba(255, 215, 0, 0.8)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 128, 128);
      context.strokeStyle = '#DAA520';
      context.lineWidth = 6;
      context.beginPath();
      context.arc(64, 64, 60, 0, Math.PI * 2);
      context.stroke();
      context.fillStyle = '#DAA520';
      context.font = 'bold 40px Arial';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText('$', 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    function createWall(x, y, z, width, height, depth, texture) {
      const wallGeometry = new THREE.BoxGeometry(width, height, depth);
      const wallMaterial = new THREE.MeshPhongMaterial({ map: texture });
      const wall = new THREE.Mesh(wallGeometry, wallMaterial);
      wall.position.set(x, y, z);
      wall.castShadow = true;
      wall.receiveShadow = true;
      scene.add(wall);
      walls.push(wall);
      if (width > depth) texture.repeat.set(width, height);
      else texture.repeat.set(depth, height);
      texture.needsUpdate = true;
    }

    function createCoin(x, y, z, texture) {
      const coinGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.05, 32);
      const coinMaterial = new THREE.MeshPhongMaterial({ map: texture, side: THREE.DoubleSide });
      const coin = new THREE.Mesh(coinGeometry, coinMaterial);
      coin.position.set(x, y, z);
      coin.rotation.z = Math.PI / 2;
      coin.castShadow = true;
      scene.add(coin);
      coins.push(coin);
    }

    function createCheckerboardTexture() {
      const size = 4;
      const data = new Uint8Array(size * size * 3);
      for (let i = 0; i < size * size; i++) {
        const x = i % size, y = Math.floor(i / size);
        const color = (x + y) % 2 === 0 ? 255 : 0;
        data[i * 3] = data[i * 3 + 1] = data[i * 3 + 2] = color;
      }
      const texture = new THREE.DataTexture(data, size, size, THREE.RGBFormat);
      texture.magFilter = THREE.NearestFilter;
      texture.needsUpdate = true;
      return texture;
    }

    function createClouds() {
      const cloudTexture = createCloudTexture();
      const cloudMaterial = new THREE.SpriteMaterial({ map: cloudTexture, transparent: true });
      for (let i = 0; i < 20; i++) {
        const cloud = new THREE.Sprite(cloudMaterial);
        cloud.position.set(Math.random() * 40 - 20, Math.random() * 5 + 5, Math.random() * 40 - 20);
        const scale = Math.random() * 2 + 1;
        cloud.scale.set(scale, scale, 1);
        scene.add(cloud);
        clouds.push(cloud);
      }
      for (let i = 0; i < 30; i++) {
        const cloud = new THREE.Sprite(cloudMaterial);
        cloud.position.set(Math.random() * 60 - 30, Math.random() * 5 - 10, Math.random() * 60 - 30);
        const scale = Math.random() * 3 + 2;
        cloud.scale.set(scale, scale, 1);
        scene.add(cloud);
        clouds.push(cloud);
      }
    }

    function createCloudTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const context = canvas.getContext('2d');
      context.fillStyle = 'rgba(255, 255, 255, 0)';
      context.fillRect(0, 0, 128, 128);
      context.fillStyle = 'rgba(255, 255, 255, 0.8)';
      context.beginPath();
      context.arc(64, 64, 32, 0, Math.PI * 2);
      context.arc(45, 64, 25, 0, Math.PI * 2);
      context.arc(83, 64, 25, 0, Math.PI * 2);
      context.fill();
      return new THREE.CanvasTexture(canvas);
    }

    /* ============================================================
       INPUT
       ============================================================ */

    function onKeyDown(event) {
      switch (event.code) {
        case 'KeyW': case 'ArrowUp': moveForward = true; break;
        case 'KeyS': case 'ArrowDown': moveBackward = true; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
        case 'KeyD': case 'ArrowRight': moveRight = true; break;
        case 'Escape': if (gameStarted && !gameWon) togglePause(); break;
      }
    }

    function onKeyUp(event) {
      switch (event.code) {
        case 'KeyW': case 'ArrowUp': moveForward = false; break;
        case 'KeyS': case 'ArrowDown': moveBackward = false; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
        case 'KeyD': case 'ArrowRight': moveRight = false; break;
      }
    }

    function setupJoystick() {
      const base = document.getElementById('joystickBase');
      const knob = document.getElementById('joystickKnob');
      const radius = 45;
      let activePointerId = null;
      let baseRect = null;

      function reset() {
        knob.style.transform = 'translate(0px, 0px)';
        joystickVector.x = 0;
        joystickVector.z = 0;
      }

      base.addEventListener('pointerdown', (e) => {
        activePointerId = e.pointerId;
        baseRect = base.getBoundingClientRect();
        base.setPointerCapture(e.pointerId);
        updateFromEvent(e);
      });
      base.addEventListener('pointermove', (e) => {
        if (e.pointerId !== activePointerId) return;
        updateFromEvent(e);
      });
      function endPointer(e) {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        reset();
      }
      base.addEventListener('pointerup', endPointer);
      base.addEventListener('pointercancel', endPointer);

      function updateFromEvent(e) {
        const cx = baseRect.left + baseRect.width / 2;
        const cy = baseRect.top + baseRect.height / 2;
        let dx = e.clientX - cx;
        let dy = e.clientY - cy;
        const len = Math.sqrt(dx * dx + dy * dy);
        if (len > radius) { dx = dx / len * radius; dy = dy / len * radius; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickVector.x = dx / radius;
        joystickVector.z = dy / radius;
      }
    }

    /* ============================================================
       PHYSICS / GAMEPLAY
       ============================================================ */

    function handleCollision(position, wall) {
      const ballRadius = 0.5;
      const wallBox = new THREE.Box3().setFromObject(wall);
      const closestPoint = wallBox.clampPoint(position, new THREE.Vector3());
      const normal = position.clone().sub(closestPoint).normalize();
      const penetrationDepth = ballRadius - position.distanceTo(closestPoint);
      if (penetrationDepth > 0) {
        position.add(normal.multiplyScalar(penetrationDepth));
        const dot = velocity.dot(normal);
        velocity.sub(normal.multiplyScalar(dot));
      }
      return position;
    }

    function checkCollision(position) {
      let collided = false;
      for (let wall of walls) {
        const wallBox = new THREE.Box3().setFromObject(wall);
        const sphere = new THREE.Sphere(position, 0.5);
        if (wallBox.intersectsSphere(sphere)) {
          position = handleCollision(position, wall);
          collided = true;
        }
      }
      return { collided, position };
    }

    function checkCoinCollision() {
      const ballRadius = 0.5;
      for (let i = coins.length - 1; i >= 0; i--) {
        if (ball.position.distanceTo(coins[i].position) < ballRadius + 0.3) {
          scene.remove(coins[i]);
          coins.splice(i, 1);
          coinsRemaining--;
          updateCoinCounter();
          sounds.coinCollect.play();
        }
      }
    }

    function checkHoleCollision() {
      const ballRadius = 0.5;
      for (let hole of holes) {
        if (ball.position.distanceTo(hole.position) < ballRadius + 0.5) {
          sounds.fallInHole.play();
          resetLevel();
          return true;
        }
      }
      return false;
    }

    function resetLevel() {
      loadLevel(currentLevel, currentSeed);
    }

    function updateCoinCounter() {
      document.getElementById('coinCountText').textContent = `Coins: ${coinsRemaining}`;
    }

    function checkWinCondition() {
      if (!currentLevelConfig) return;
      const winPosition = currentLevelConfig.winPos;
      if (ball.position.distanceTo(winPosition) < 1 && coinsRemaining === 0) {
        if (endlessMode || currentLevel < totalLevels) {
          saveBestTime(currentLevel, elapsedMillis());
          currentLevel++;
          sounds.levelComplete.play();
          loadLevel(currentLevel);
          startTime = Date.now();
        } else if (!gameWon) {
          saveBestTime(currentLevel, elapsedMillis());
          gameWon = true;
          showWinScreen();
        }
      }
    }

    function elapsedMillis() {
      return Date.now() - startTime;
    }

    function saveBestTime(level, ms) {
      try {
        const key = `bestTime_level_${level}`;
        const existing = parseInt(localStorage.getItem(key) || '0', 10);
        if (!existing || ms < existing) localStorage.setItem(key, String(ms));
      } catch (e) {}
    }

    function getBestTime(level) {
      try {
        const v = localStorage.getItem(`bestTime_level_${level}`);
        if (!v) return null;
        const ms = parseInt(v, 10);
        const m = Math.floor(ms / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      } catch (e) { return null; }
    }

    function showWinScreen() {
      sounds.backgroundMusic.stop();
      sounds.winSound.play();
      const winMessage = document.getElementById('winMessage');
      winMessage.style.display = 'block';
      setTimeout(() => { winMessage.style.opacity = 1; }, 100);
      createFireworks();

      const radius = 10;
      let angle = 0;
      function rotateCameraWin() {
        if (gameWon) {
          angle += 0.01;
          camera.position.x = ball.position.x + radius * Math.cos(angle);
          camera.position.z = ball.position.z + radius * Math.sin(angle);
          camera.lookAt(ball.position);
          requestAnimationFrame(rotateCameraWin);
        }
      }
      rotateCameraWin();
      clearInterval(timerInterval);
    }

    function createFireworks() {
      const fireworksContainer = document.getElementById('fireworks');
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const firework = document.createElement('div');
          firework.style.position = 'absolute';
          firework.style.width = '5px';
          firework.style.height = '5px';
          firework.style.borderRadius = '50%';
          firework.style.backgroundColor = getRandomColor();
          firework.style.left = Math.random() * 100 + '%';
          firework.style.top = Math.random() * 100 + '%';
          fireworksContainer.appendChild(firework);
          animateFirework(firework);
        }, Math.random() * 5000);
      }
    }

    function animateFirework(firework) {
      let opacity = 1, scale = 1, frame = 0;
      function step() {
        frame++;
        opacity -= 0.01;
        scale += 0.02;
        firework.style.opacity = opacity;
        firework.style.transform = `scale(${scale})`;
        if (frame < 100) requestAnimationFrame(step);
        else firework.remove();
      }
      step();
    }

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) color += letters[Math.floor(Math.random() * 16)];
      return color;
    }

    /* ============================================================
       TIMER
       ============================================================ */

    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 30);
    }

    function updateTimer() {
      if (paused) return;
      const elapsedTime = new Date(Date.now() - startTime);
      const minutes = String(elapsedTime.getUTCMinutes()).padStart(2, '0');
      const seconds = String(elapsedTime.getUTCSeconds()).padStart(2, '0');
      const milliseconds = String(elapsedTime.getUTCMilliseconds()).padStart(3, '0');
      document.getElementById('timerText').textContent = `${minutes}:${seconds}.${milliseconds}`;
    }

    /* ============================================================
       MAIN LOOP
       ============================================================ */

    function animate() {
      requestAnimationFrame(animate);
      if (!gameStarted) return;
      if (paused || gameWon) { renderer.render(scene, camera); return; }

      const delta = 0.016;
      const maxSpeed = 5;
      const friction = 0.98;

      const kx = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0);
      const kz = (moveBackward ? 1 : 0) - (moveForward ? 1 : 0);

      let ax = kx + joystickVector.x;
      let az = kz + joystickVector.z;
      const mag = Math.sqrt(ax * ax + az * az);
      if (mag > 1) { ax /= mag; az /= mag; }
      acceleration.set(ax, 0, az);
      acceleration.multiplyScalar(20);

      velocity.add(acceleration.multiplyScalar(delta));
      velocity.multiplyScalar(friction);
      if (velocity.length() > maxSpeed) velocity.normalize().multiplyScalar(maxSpeed);

      const newPosition = ball.position.clone().add(velocity.clone().multiplyScalar(delta));
      const collisionResult = checkCollision(newPosition);
      if (collisionResult.collided) ball.position.copy(collisionResult.position);
      else ball.position.copy(newPosition);

      const rotationAxis = new THREE.Vector3(velocity.z, 0, -velocity.x).normalize();
      const rotationAngle = velocity.length() * delta / 0.5;
      if (!isNaN(rotationAxis.x)) {
        ball.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(rotationAxis, rotationAngle));
      }

      const cameraOffset = new THREE.Vector3(0, 5, 7);
      camera.position.copy(ball.position).add(cameraOffset);
      camera.lookAt(ball.position);

      coins.forEach(coin => { coin.rotation.y += 0.1; });
      clouds.forEach(cloud => {
        cloud.position.x += 0.01;
        if (cloud.position.x > 30) cloud.position.x = -30;
      });

      checkCoinCollision();
      if (checkHoleCollision()) { renderer.render(scene, camera); return; }
      checkWinCondition();

      renderer.render(scene, camera);
    }

    /* ============================================================
       PAUSE
       ============================================================ */

    function togglePause() {
      paused = !paused;
      const pauseMenu = document.getElementById('pauseMenu');
      if (paused) {
        pausedAt = Date.now();
        pauseMenu.classList.remove('hidden');
      } else {
        startTime += (Date.now() - pausedAt);
        pauseMenu.classList.add('hidden');
      }
    }

    /* ============================================================
       MENUS / GAME FLOW
       ============================================================ */

    function setControlScheme(scheme) {
      controlScheme = scheme;
      document.getElementById('pcBtn').classList.toggle('selected', scheme === 'pc');
      document.getElementById('mobileBtn').classList.toggle('selected', scheme === 'mobile');
      const joystick = document.getElementById('joystickBase');
      const mobilePause = document.getElementById('mobilePauseBtn');
      if (scheme === 'mobile') {
        joystick.classList.remove('hidden');
        mobilePause.classList.remove('hidden');
      } else {
        joystick.classList.add('hidden');
        mobilePause.classList.add('hidden');
        joystickVector.x = 0; joystickVector.z = 0;
      }
    }

    function buildLevelGrid() {
      const grid = document.getElementById('levelGrid');
      grid.innerHTML = '';
      for (let lvl = 1; lvl <= totalLevels; lvl++) {
        const diff = difficultyLabel(lvl);
        const tile = document.createElement('div');
        tile.className = `levelTile ${diff.cls}`;
        const best = getBestTime(lvl);
        tile.innerHTML = `<div>${lvl}</div><span class="diff">${diff.text}</span>${best ? `<span class="best">${ICONS.trophy}${best}</span>` : ''}`;
        tile.addEventListener('click', () => startGame(lvl, false));
        grid.appendChild(tile);
      }
      const endlessTile = document.createElement('div');
      endlessTile.id = 'endlessTile';
      endlessTile.className = 'levelTile';
      endlessTile.innerHTML = `${ICONS.infinity}<div>Endless</div><span class="diff">Infinite levels</span>`;
      endlessTile.addEventListener('click', () => startGame(1, true));
      grid.appendChild(endlessTile);
    }

    function showOverlay(id) {
      document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function hideAllOverlays() {
      document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
    }

    function startGame(level, isEndless) {
      endlessMode = isEndless;
      currentLevel = level;
      gameWon = false;
      hideAllOverlays();
      document.getElementById('winMessage').style.display = 'none';
      document.getElementById('winMessage').style.opacity = 0;

      initRenderer();
      gameStarted = true;
      loadLevel(currentLevel);
      startTimer();

      setTimeout(() => { sounds.backgroundMusic.play(); }, 1500);
    }

    function returnToMainMenu() {
      gameStarted = false;
      gameWon = false;
      paused = false;
      clearInterval(timerInterval);
      sounds.backgroundMusic.stop();
      document.getElementById('winMessage').style.display = 'none';
      document.getElementById('winMessage').style.opacity = 0;
      showOverlay('mainMenu');
    }

    /* ---------------- Wiring ---------------- */

    document.getElementById('pcBtn').addEventListener('click', () => setControlScheme('pc'));
    document.getElementById('mobileBtn').addEventListener('click', () => setControlScheme('mobile'));
    document.getElementById('playBtn').addEventListener('click', () => startGame(1, false));
    document.getElementById('endlessBtn').addEventListener('click', () => startGame(1, true));
    document.getElementById('levelSelectBtn').addEventListener('click', () => { buildLevelGrid(); showOverlay('levelSelectMenu'); });
    document.getElementById('backToMenuBtn').addEventListener('click', () => showOverlay('mainMenu'));

    document.getElementById('pauseBtn').addEventListener('click', togglePause);
    document.getElementById('mobilePauseBtn').addEventListener('click', togglePause);
    document.getElementById('resumeBtn').addEventListener('click', togglePause);
    document.getElementById('restartBtn').addEventListener('click', () => { togglePause(); resetLevel(); startTime = Date.now(); });
    document.getElementById('regenBtnMenu').addEventListener('click', () => { togglePause(); loadLevel(currentLevel, Date.now()); startTime = Date.now(); });
    document.getElementById('regenBtn').addEventListener('click', () => { loadLevel(currentLevel, Date.now()); startTime = Date.now(); });
    document.getElementById('pauseLevelSelectBtn').addEventListener('click', () => { paused = false; buildLevelGrid(); showOverlay('levelSelectMenu'); });
    document.getElementById('mainMenuBtn').addEventListener('click', () => { paused = false; returnToMainMenu(); });
    document.getElementById('winMainMenuBtn').addEventListener('click', returnToMainMenu);

    setupJoystick();
    showOverlay('mainMenu');
  </script>
  </body></html>
